[package]
name = "esxi-folder-fuse"
version = "0.2.0"
edition = "2021"
authors = [ "Wolfgang Bumiller <w.bumiller@proxmox.com>" ]
license = "AGPL-3"
description = "ESXi fuse client"
homepage = "https://www.proxmox.com"

[dependencies]
anyhow = "1"
futures = "0.3.28"
http = "0.2.9"
hyper = "0.14"
libc = "0.2"
log = "0.4"
nix = "0.26"
once_cell = "1.17"
openssl = "0.10.57"
percent-encoding = "2.2"
pico-args = "0.4.2"
regex = "1.7.1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
syslog = "6"
tokio = { version = "1", features = [ "macros", "rt-multi-thread", "time" ] }

proxmox-fuse = "0.1.6"
proxmox-http = { version = "0.9", features = [ "client" ] }
