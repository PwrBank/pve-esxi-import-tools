[package]
name = "esxi-folder-fuse"
version = "1.1.3"
edition = "2024"
authors = [
    "Wolfgang Bumiller <w.bumiller@proxmox.com>",
    'Proxmox Development Team <support@proxmox.com>',
]
license = "AGPL-3"
description = "ESXi fuse client"
homepage = "https://www.proxmox.com"

[dependencies]
anyhow = "1"
env_logger = "0.11"
futures = "0.3.28"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = [ "client", "http1", "http2" ] }
libc = "0.2"
log = "0.4"
nix = "0.29"
num_cpus = "1"
once_cell = "1.17"
openssl = "0.10.57"
percent-encoding = "2.2"
pico-args = "0.5"
regex = "1.7.1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
syslog = "6"
tokio = { version = "1", features = [ "macros", "rt-multi-thread", "time", "process", "io-util" ] }

proxmox-async = { git = "https://git.proxmox.com/git/proxmox.git", package = "proxmox-async" }
proxmox-fuse = { git = "https://git.proxmox.com/git/proxmox-fuse.git" }
proxmox-http = { git = "https://git.proxmox.com/git/proxmox.git", package = "proxmox-http", features = [ "body", "client" ] }
