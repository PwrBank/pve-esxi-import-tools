[package]
name = "esxi-folder-fuse"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
futures = "0.3.28"
http = "0.2.9"
hyper = "0.14"
openssl = "0.10.57"
percent-encoding = "2.2"
pico-args = "0.4.2"
regex = "1.7.1"
tokio = { version = "1", features = [ "macros", "rt-multi-thread" ] }

proxmox-fuse = "0.1.4"
proxmox-http = { version = "0.9", features = [ "client" ] }
